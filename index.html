<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="tarefas.css">
</head>
<body>
    <div class="container">
        <h1>Lista de Tarefas</h1>
        
        <div class="task-form">
            <h2>Adicionar Nova Tarefa</h2>
            <form id="addTaskForm">
                <div class="form-group">
                    <label for="taskTitle">Título:</label>
                    <input type="text" id="taskTitle" name="taskTitle" required>
                </div>
                
                <div class="form-group">
                    <label for="taskDescription">Descrição:</label>
                    <textarea id="taskDescription" name="taskDescription" rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="taskDeadline">Data de Deadline:</label>
                    <input type="date" id="taskDeadline" name="taskDeadline" required>
                </div>
                
                <button type="submit" class="btn-add">Adicionar Tarefa</button>
            </form>
        </div>
        
        <div class="tasks-container">
            <h2>Minhas Tarefas</h2>
            <div id="tasksList"></div>
        </div>
    </div>
    
    <script src="tarefas.js"></script>
</body>
</html>
